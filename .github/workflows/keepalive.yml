name: Keep backend awake

# Render bepul xizmati 15 daqiqa harakatsizlikда uxlaydi. Har ~10 daqiqada /health ga ping
# yuborib, uyg'oq ushlab turamiz (bot polling + relay doim tayyor bo'lsin).
# Deploy'dan keyin RENDER_URL ni haqiqiy manzilга o'zgartiring.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

env:
  RENDER_URL: https://remote-desktop-backend-1lfo.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: curl -fsS --max-time 30 "${RENDER_URL}/health" || true
